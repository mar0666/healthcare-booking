<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare Appointment Booking System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Healthcare Appointment Booking System</h1>
  </header>
  <main class="container">
    <section class="card">
      <h2>Book an Appointment</h2>
      <form id="booking-form">
        <div class="form-group">
          <label for="patientName">Patient Full Name</label>
          <input type="text" id="patientName" required placeholder="e.g., Jordan Taylor" />
        </div>
        <div class="form-group">
          <label for="provider">Healthcare Provider</label>
          <select id="provider" required>
            <option value="">-- Select a Provider --</option>
            <option value="Dr. Sarah Smith (Family Medicine)">Dr. Sarah Smith (Family Medicine)</option>
            <option value="Dr. David Lee (Pediatrics)">Dr. David Lee (Pediatrics)</option>
            <option value="Dr. Priya Patel (Dermatology)">Dr. Priya Patel (Dermatology)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date">Appointment Date</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label for="timeSlot">Available Time Slot</label>
          <select id="timeSlot" required>
            <option value="">-- Select a Time --</option>
            <option value="09:00 AM">09:00 AM</option>
            <option value="10:30 AM">10:30 AM</option>
            <option value="01:00 PM">01:00 PM</option>
            <option value="03:30 PM">03:30 PM</option>
          </select>
        </div>
        <button type="submit" class="primary-btn">Confirm Booking</button>
      </form>
      <p id="status-message" class="status-msg" role="alert"></p>
    </section>
    <section class="card">
      <h2>Scheduled Appointments</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Provider</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="appointments-list">
            <tr><td colspan="5">Loading appointments...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
